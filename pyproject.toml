[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "the-paw-memory"
version = "0.2.1"
description = "A self-contained, card-based long-term memory engine for chat backends."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0",
    "numpy>=1.24",
    "jieba>=0.42",
]

[project.optional-dependencies]
# Vector search for retrieve()'s flat fallback. The region path and the summary
# gate are now pure-literal (no embedder) — region retrieval works without these;
# only retrieve()'s vector search needs them.
vectors = [
    "faiss-cpu>=1.7",
    "sentence-transformers>=2.2",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
thepaw_memory = ["config/*.yml", "*.txt"]
